<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a3023">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Dex">
<title>Field Dex</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/pixelify-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<!-- Fetch every module at once instead of one import at a time. -->
<link rel="modulepreload" href="js/app.js"><link rel="modulepreload" href="js/data.js"><link rel="modulepreload" href="js/bird.js"><link rel="modulepreload" href="js/store.js">
<link rel="modulepreload" href="js/api.js"><link rel="modulepreload" href="js/match.js"><link rel="modulepreload" href="js/marks.js"><link rel="modulepreload" href="js/sound.js">
<link rel="modulepreload" href="js/forecast.js"><link rel="modulepreload" href="js/sprites.js"><link rel="modulepreload" href="js/songid.js"><link rel="modulepreload" href="js/photo.js">
<link rel="modulepreload" href="js/lite.js"><link rel="modulepreload" href="js/looks.js">
</head>
<body>
<div id="app">
  <div id="toTop" aria-hidden="true"></div>
  <header class="shell">
    <i class="lens"></i><i class="lt red"></i><i class="lt amber"></i><i class="lt green"></i>
    <button class="brand" id="settingsBtn" aria-label="Settings">FIELD DEX ⚙︎</button>
  </header>
  <main id="view"></main>
  <script>try { var s = localStorage.getItem('dexSnap'); if (s) document.getElementById('view').innerHTML = s; } catch (e) {}</script>
  <nav class="tabs">
    <button id="tabDex" class="on">DEX</button>
    <div class="ballwrap">
      <i class="hint" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2 6 L6 2 L10 6M2 11 L6 7 L10 11"/></svg></i>
      <button id="ball" aria-label="Swipe up to catch a bird"></button>
    </div>
    <button id="tabNear">NEARBY</button>
  </nav>
  <div id="layer"></div>
  <div id="toast" hidden></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
