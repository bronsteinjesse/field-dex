<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a3023">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Dex">
<title>Field Dex</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="shell">
    <i class="lens"></i><i class="lt red"></i><i class="lt amber"></i><i class="lt green"></i>
    <button class="brand" id="settingsBtn" aria-label="Settings">FIELD DEX ⚙︎</button>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <button id="tabDex" class="on">DEX</button>
    <div class="ballwrap">
      <i class="hint" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2 6 L6 2 L10 6M2 11 L6 7 L10 11"/></svg></i>
      <button id="ball" aria-label="Tap to describe a bird, swipe up to record its song"></button>
    </div>
    <button id="tabNear">NEARBY</button>
  </nav>
  <div id="layer"></div>
  <div id="toast" hidden></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
